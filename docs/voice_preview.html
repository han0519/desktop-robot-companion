<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小纸壳 · 机器人音色预览（实时试听）</title>
<style>
  :root{--bg:#0b1020;--card:#141a2e;--card2:#1b2340;--line:#26304f;--tx:#e8f0ff;--tx2:#93a0c4;--acc:#00d4ff}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(900px 600px at 12% -10%,#17224a 0%,transparent 60%),radial-gradient(700px 500px at 100% 0%,#241a4a 0%,transparent 55%),var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 70px}
  h1{margin:0 0 6px;font-size:22px}
  .sub{color:var(--tx2);font-size:13px;margin-bottom:18px}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
  .fxrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  .fx{padding:11px 8px;border:1px solid var(--line);border-radius:11px;background:#101733;cursor:pointer;text-align:center;transition:.15s;font-size:13px}
  .fx:hover{border-color:#39507f}
  .fx.on{border-color:var(--acc);background:#0e2233;box-shadow:0 0 0 1px #00d4ff33 inset}
  .fx .d{font-size:10.5px;color:var(--tx2);margin-top:3px}
  label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin:12px 0 4px}
  label b{color:var(--acc)}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .btn{border:1px solid var(--line);background:#101733;color:var(--tx);border-radius:10px;padding:10px 18px;cursor:pointer;font-size:14px}
  .btn:hover{border-color:#39507f}
  .btn.play{border-color:var(--acc);color:var(--acc);font-weight:600}
  .btn.on{border-color:var(--acc);color:var(--acc)}
  .btnrow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .tip{color:var(--tx2);font-size:12px;margin-top:12px}
  .tip b{color:#ffd479}
</style>
</head>
<body>
<div class="wrap">
  <h1>机器人音色预览 — Web Audio 实时试听</h1>
  <div class="sub">点一个效果 → 点 <b>▶ 播放</b>，合成语音会经过<b>与设备端同一套算法</b>的效果链。滑块实时可调，调好后把<b>滑块数值截图</b>给我。</div>

  <div class="card"><div class="fxrow" id="fxrow"></div>
    <div class="btnrow">
      <button class="btn play" id="play">▶ 播放试听</button>
      <button class="btn" id="stop">■ 停止</button>
      <button class="btn" id="direct">绕过效果直连: 关</button>
      <span style="color:var(--tx2);font-size:12px" id="stat">就绪</span>
    </div>
    <div style="margin-top:10px;height:8px;background:#0d1428;border-radius:4px;overflow:hidden">
      <div id="lvl" style="height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#7cff6b)"></div>
    </div>
    <div class="tip" style="margin-top:6px">播放时这条绿色电平条会动 —— 如果<b>纹丝不动</b>说明音频没流过效果链(截图给我)。</div>
  </div>

  <div class="card">
    <label>环形调制频率 <b><span id="v_rf">120</span> Hz</b>（电流/金属感的来源，0=关闭）</label>
    <input type="range" id="rf" min="0" max="400" value="120">
    <label>调制深度 <b><span id="v_rd">38</span>%</b></label>
    <input type="range" id="rd" min="0" max="100" value="38">
    <label>调制波形</label>
    <div style="display:flex;gap:8px">
      <button class="btn on" id="w_s">正弦(柔和)</button>
      <button class="btn" id="w_q">方波(刺耳/电流感)</button>
    </div>
    <label>量化位数 <b><span id="v_cb">10</span> bit</b>（越小越"电子颗粒"）</label>
    <input type="range" id="cb" min="5" max="16" value="10">
    <label>回声时长 <b><span id="v_et">0</span> ms</b></label>
    <input type="range" id="et" min="0" max="300" value="0">
    <label>回声强度 <b><span id="v_eg">0</span>%</b></label>
    <input type="range" id="eg" min="0" max="80" value="0">
    <label>输出增益 <b><span id="v_gn">100</span>%</b>（过大=失真，也是效果）</label>
    <input type="range" id="gn" min="50" max="300" value="100">
    <label>语速(音调) <b><span id="v_rt">1.00</span>×</b>（小于1变低沉稍慢）</label>
    <input type="range" id="rt" min="60" max="120" value="100">
  </div>

  <div class="card">
    <div style="font-size:13px;margin-bottom:6px">预设（点一下自动拨好滑块）</div>
    <div class="fxrow" id="presets"></div>
  </div>

  <div class="card">
    <div style="font-size:13px;margin-bottom:6px">导出参数（点复制 → 粘贴发给开发者）</div>
    <textarea id="exp" rows="3" style="width:100%;background:#0d1428;color:#9fe8ff;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 monospace" readonly></textarea>
    <div class="btnrow"><button class="btn" id="copyexp">复制参数</button></div>
  </div>

  <div class="tip">① 试听的女声是<b>电脑合成</b>示例；设备上实际是<b>小智服务端的音色</b>，套同一套效果器后"机器味"一致。
    ② 全 0/16bit = 原声。③ 固件实现的就是 <b>环形调制 → 量化 → 回声 → 增益</b> 这条链，与页面一致。</div>
</div>
<script src="voice_fx.js"></script>
</body>
</html>
